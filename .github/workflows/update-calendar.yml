name: Update public calendar events

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Outlook events
        run: python3 scripts/update_calendar.py
      - name: Publish changed event data
        run: |
          if git diff --quiet -- calendar-events.json; then
            echo "Calendar is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar-events.json
          git commit -m "Update public calendar events"
          git push
